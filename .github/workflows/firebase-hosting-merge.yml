name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application
        run: npm run build

      # Check and guide if credentials are missing
      - name: Check Firebase Secrets
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANAFORGE == '' && secrets.FIREBASE_TOKEN == '' }}
        run: |
          echo "::error::GitHub Secret 'FIREBASE_SERVICE_ACCOUNT_RAVANAFORGE' is not set in this repository."
          echo "Please add it in GitHub Settings -> Secrets and variables -> Actions."
          exit 1

      # Preferred: Official Firebase deploy using Service Account
      - name: Deploy to Firebase Hosting (Service Account)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANAFORGE != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANAFORGE }}'
          channelId: live
          projectId: ravanaforge

      # Alternative: Deploy using FIREBASE_TOKEN
      - name: Deploy to Firebase Hosting (CLI Token)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANAFORGE == '' && secrets.FIREBASE_TOKEN != '' }}
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project ravanaforge
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
